<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Leaf</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Google Fonts: Playfair Display and Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- App Bar / Navigation -->
    <header class="app-bar">
        <div class="logo">
            Healthy Leaf
        </div>
        <nav class="nav-links">
            <button class="nav-btn" id="nav-home">Home</button>
            <button class="nav-btn" id="nav-trainers">Diet Trainer</button>
            <button class="nav-btn" id="nav-meals">Custom Meals</button>
            <button class="nav-btn" id="nav-about">About US</button>
        </nav>
        <div class="actions">
            <button class="nav-btn" id="btn-settings">Settings</button>
        </div>
    </header>

    <!-- Body / Main Content -->
    <main class="main-content">
        <div class="hero-section">
            <h1 class="gradient-text">Your Health, Simplified.</h1>
            <p class="subtitle">
                Personalized diet plans, expert trainers, and customizable meals to<br>
                delivered to your door.
            </p>
            <div class="cta-row">
                <button class="primary-btn" id="btn-find-trainer">Find a Trainer</button>
                <button class="primary-btn" id="btn-build-meal">Build a Meal</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
